<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordle - Play</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">Bordle</a>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="game.html">Play</a>
          <a href="information.html">Info</a>
        </nav>
      </div>
    </header>

    <div id="container">
    <h1>Bordle</h1>
    <div id="inputs">
    <input type="text" id="01Char" maxlength="1" class="row0"/>
    <input type="text" id="02Char" maxlength="1" class="row0"/>
    <input type="text" id="03Char" maxlength="1" class="row0"/>
    <input type="text" id="04Char" maxlength="1" class="row0"/>
    <input type="text" id="05Char" maxlength="1" class="row0"/>
    </div>
    <div id="inputs2">
        <input type="text" id="06Char" maxlength="1" class="row1"/>
        <input type="text" id="07Char" maxlength="1" class="row1"/>
        <input type="text" id="08Char" maxlength="1" class="row1"/>
        <input type="text" id="09Char" maxlength="1" class="row1"/>
        <input type="text" id="10Char" maxlength="1" class="row1"/>
    </div>
    <div id="inputs3">
        <input type="text" id="11Char" maxlength="1" class="row2"/>
        <input type="text" id="12Char" maxlength="1" class="row2"/>
        <input type="text" id="13Char" maxlength="1" class="row2"/>
        <input type="text" id="14Char" maxlength="1" class="row2"/>
        <input type="text" id="15Char" maxlength="1" class="row2"/>
    </div>
    <div id="inputs4">
        <input type="text" id="16Char" maxlength="1" class="row3"/>
        <input type="text" id="17Char" maxlength="1" class="row3"/>
        <input type="text" id="18Char" maxlength="1" class="row3"/>
        <input type="text" id="19Char" maxlength="1" class="row3"/>
        <input type="text" id="20Char" maxlength="1" class="row3"/>
    </div>
    <div id="inputs5">
        <input type="text" id="21Char" maxlength="1" class="row4"/>
        <input type="text" id="22Char" maxlength="1" class="row4"/>
        <input type="text" id="23Char" maxlength="1" class="row4"/>
        <input type="text" id="24Char" maxlength="1" class="row4"/>
        <input type="text" id="25Char" maxlength="1" class="row4"/>
    </div>
    <div id="inputs6">
        <input type="text" id="26Char" maxlength="1" class="row5"/>
        <input type="text" id="27Char" maxlength="1" class="row5"/>
        <input type="text" id="28Char" maxlength="1" class="row5"/>
        <input type="text" id="29Char" maxlength="1" class="row5"/>
        <input type="text" id="30Char" maxlength="1" class="row5"/>
    </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="popup-overlay" style="display:none">
      <div class="popup-card">
        <h2 id="modal-title">Game Over</h2>
        <p id="modal-message">The correct word was: <span id="modal-answer"></span></p>
        <div style="margin-top:12px; display:flex; gap:8px; justify-content:center">
          <button id="modal-restart">Restart</button>
          <a href="information.html"><button id="modal-info">Info</button></a>
          <a href="index.html"><button id="modal-home">Home</button></a>
        </div>
      </div>
    </div>

    <script src="myscript.js"></script>
    <script src="autotext.js"></script>
</body>
</html>

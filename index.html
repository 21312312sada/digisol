
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordle - Home</title>
    <link rel="stylesheet" href="mystyle.css">
    <style>
      .home-container {
        max-width: 600px;
        text-align: center;
        margin: 60px auto;
        padding: 0 20px;
      }

      .home-container h1 {
        font-size: clamp(32px, 5vw, 56px);
        margin: 20px 0;
        color: #fff;
      }

      .home-container p {
        font-size: clamp(14px, 2vw, 18px);
        color: #cfe6ff;
        line-height: 1.6;
        margin: 16px 0;
      }

      .home-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 32px;
        flex-wrap: wrap;
      }

      .home-buttons a {
        text-decoration: none;
      }

      .home-buttons button {
        padding: 14px 28px;
        border-radius: 10px;
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 200ms ease;
      }

      .btn-play {
        background: var(--accent);
        color: #fff;
      }

      .btn-play:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(124, 92, 255, 0.4);
      }

      .btn-info {
        background: rgba(255, 255, 255, 0.1);
        color: #e6eef8;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-info:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .home-description {
        background: rgba(255, 255, 255, 0.04);
        padding: 24px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-top: 32px;
        text-align: left;
      }

      .home-description h3 {
        color: #fff;
        margin-top: 0;
      }

      .home-description ul {
        text-align: left;
        padding-left: 20px;
      }

      .home-description li {
        margin: 8px 0;
        color: #cfe6ff;
      }
    </style>
</head>
<body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">Bordle</a>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="game.html">Play</a>
          <a href="information.html">Info</a>
        </nav>
      </div>
    </header>

    <div class="home-container">
      <h1>Bordle</h1>
      <p>Guess the word in 6 tries or less!</p>

      <div class="home-buttons">
        <a href="game.html"><button class="btn-play">Play Now</button></a>
        <a href="information.html"><button class="btn-info">Learn More</button></a>
      </div>

      <div class="home-description">
        <h3>How it Works</h3>
        <ul>
          <li>Guess a 5-letter word in 6 attempts or less</li>
          <li><strong style="color: #6aaa64">Green</strong> = correct letter in correct position</li>
          <li><strong style="color: #c9b458">Yellow</strong> = correct letter in wrong position</li>
          <li><strong style="color: #787c7e">Gray</strong> = letter not in the word</li>
        </ul>
      </div>
    </div>
</body>
</html>
